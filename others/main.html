<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: url(../images/park0301.jpg);
        }

        .map {
            /* 看圖片的大小去設高跟寬 */
            width: 452px;
            height: 631px;
            margin: auto;

            position: relative;
        }

        .a1 {
            /* 先設定寬、高100px、left top 0 、border-radius 0px 、
               作為預設值，然後網頁按下F12去調整樣式 */
            width: 130px;
            height: 30px;
            position: absolute;
            left: 213px;
            top: 50px;
            /* background-color: rgba(0, 0, 0, 0.5); */
            border-radius: 15px;
        }

        .a2 {
            /* 先設定寬、高100px、left top 0 、border-radius 50%、
               作為預設值，然後網頁按下F12去調整樣式 */
            width: 50px;
            height: 45px;
            position: absolute;
            left: 270px;
            top: 180px;
            /* background-color: rgba(0, 0, 0, 0.5); */
            border-radius: 50%;
        }

        .info {
            text-align: right;
            color: #ff00ff;
        }
    </style>
</head>

<body>
    <div class="map">
        <img src="../images/national_park.jpg">
        <a class="a1" href="../park/yangmingshan.html"></a>
        <a class="a2" href="../park/sheipa.html"></a>
    </div>
    <div class="info">資料來源：內政部營建署『臺灣的國家公園』網站 </div>
</body>

</html>
